server:
  port: 8080
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: cynbit-backend-remediation
  threads:
    virtual:
      enabled: true

# Security & JWT Configuration
app:
  security:
    jwt:
      secret: ${JWT_SECRET:cynbit-audit-super-secret-hmac-sha256-key-with-sufficient-entropy-for-enterprise-security-2026}
      expiration-ms: ${JWT_EXPIRATION_MS:28800000} # 8 hours default
      cookie-name: ${JWT_COOKIE_NAME:cynbit_session}
  cors:
    allowed-origins:
      - "https://www.cynbit.in"
      - "https://portal.cynbit.in"
      - "http://localhost:3000"
  rate-limiting:
    inquiry-limit-per-5-minutes: ${INQUIRY_RATE_LIMIT:10}
    career-limit-per-15-minutes: ${CAREER_RATE_LIMIT:5}

logging:
  level:
    root: INFO
    com.cynbit.remediation: DEBUG
    org.springframework.security: INFO

