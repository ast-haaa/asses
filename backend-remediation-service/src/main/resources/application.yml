server:
  port: 8080
  servlet:
    context-path: /
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

spring:
  application:
    name: cynbit-backend-remediation
  profiles:
    default: in-memory

# Security & JWT Configuration
app:
  security:
    dev-seed:
      enabled: ${DEV_SEED_ENABLED:false}
      username: ${DEV_SEED_USERNAME:dev-admin@example.local}
      password: ${DEV_SEED_PASSWORD:}
      role: ${DEV_SEED_ROLE:ROLE_HR_ADMIN}
    jwt:
      secret: ${JWT_SECRET}
      expiration-ms: ${JWT_EXPIRATION_MS:28800000} # 8 hours default
      issuer: ${JWT_ISSUER:cynbit.in}
      cookie-name: ${JWT_COOKIE_NAME:cynbit_session}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://www.cynbit.in,https://portal.cynbit.in}
  rate-limiting:
    inquiry-limit-per-5-minutes: ${INQUIRY_RATE_LIMIT:10}
    career-limit-per-15-minutes: ${CAREER_RATE_LIMIT:5}

logging:
  level:
    root: INFO
    com.cynbit.remediation: DEBUG
    org.springframework.security: INFO

---
# ==============================================================================
# UNIMPLEMENTED ARCHITECTURAL EXAMPLE: MySQL Profile
# ==============================================================================
# NOTICE: The reference service operates strictly in-memory (ConcurrentHashMap).
# Live Spring Data JPA repositories and MySQL connections are NOT implemented
# in this standalone evaluation build.
#
# This profile serves as an architectural configuration blueprint showing how a
# production deployment would configure MySQL 8.0+ with enforced TLS (sslMode=REQUIRED)
# and mandatory externalized credentials (no plaintext fallbacks).
# ==============================================================================
spring:
  config:
    activate:
      on-profile: mysql-example
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/cynbit_remediation_db?sslMode=REQUIRED&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql


