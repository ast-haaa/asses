server:
  port: 0
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

spring:
  application:
    name: cynbit-backend-remediation-test
  profiles:
    default: test

app:
  security:
    jwt:
      secret: test-secret-key-with-sufficient-entropy-for-hmac-sha256-testing-enterprise-level-1234567890
      expiration-ms: 28800000
      issuer: cynbit.in
      cookie-name: cynbit_session
  cors:
    allowed-origins:
      - "https://www.cynbit.in"
      - "https://portal.cynbit.in"
      - "http://localhost:3000"
  rate-limiting:
    inquiry-limit-per-5-minutes: 10
    career-limit-per-15-minutes: 5

logging:
  level:
    root: WARN
    com.cynbit.remediation: INFO

